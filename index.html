<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Simple Music Player</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background: #f4f4f4;
      padding-top: 50px;
    }
    .player {
      background: white;
      padding: 20px;
      border-radius: 10px;
      width: 300px;
      margin: auto;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    button {
      margin: 10px;
      padding: 10px 15px;
      font-size: 16px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="player">
    <h2>🎵 Music Player</h2>
    
    <audio id="audio" src="Gata only (dsvcr remix _ extended) - floyymenor [edit audio](MP3_320K).mp3"></audio>

    <div>
      <button onclick="playMusic()">▶ Play</button>
      <button onclick="pauseMusic()">⏸ Pause</button>
    </div>
  </div>

  <script>
    const audio = document.getElementById("audio");

    function playMusic() {
      audio.play();
    }

    function pauseMusic() {
      audio.pause();
    }
  </script>

</body>
</html>
