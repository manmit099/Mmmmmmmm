<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover"/>
  <title>ARCADE</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{
      --bg:#000;--fg:#fff;--dim:#222;--mid:#555;
      --a1:#e8ff57;  /* runner accent - yellow  */
      --a2:#57e8ff;  /* brix accent   - cyan    */
      --accent:var(--a1);
      --btn-h:88px;
      --safe-bottom:env(safe-area-inset-bottom,0px);
    }
    html,body{
      background:var(--bg);color:var(--fg);
      font-family:-apple-system,BlinkMacSystemFont,sans-serif;
      height:100%;overflow:hidden;
      touch-action:none;user-select:none;-webkit-user-select:none;
    }
    #app{
      display:flex;flex-direction:column;align-items:center;
      width:100%;height:100dvh;overflow:hidden;
    }

    /* ── TOP BAR ── */
    #topbar{
      width:100%;max-width:480px;
      display:flex;justify-content:space-between;align-items:center;
      padding:14px 18px 6px;flex-shrink:0;
    }
    #game-title{
      font-family:'Press Start 2P',monospace;font-size:9px;
      color:var(--accent);letter-spacing:.05em;
      text-shadow:0 0 10px var(--accent);
      transition:color .4s,text-shadow .4s;
    }
    #topright{display:flex;align-items:center;gap:10px}
    #score-display{font-family:'Press Start 2P',monospace;font-size:8px;color:var(--mid)}
    #score-display span{color:var(--fg)}
    #lives{display:flex;gap:5px;align-items:center}
    .life-pip{
      width:7px;height:7px;border-radius:50%;
      background:var(--accent);box-shadow:0 0 6px var(--accent);
      transition:background .2s,box-shadow .2s,all .4s;
    }
    .life-pip.dead{background:#222;box-shadow:none}

    /* menu button */
    #menu-btn{
      font-family:'Press Start 2P',monospace;font-size:7px;
      color:#444;background:none;border:none;cursor:pointer;
      letter-spacing:.05em;padding:4px 6px;
      -webkit-tap-highlight-color:transparent;
      transition:color .2s;
    }
    #menu-btn:active{color:var(--mid)}
    #menu-btn.hidden{display:none}

    /* ── CANVAS WRAP ── */
    #canvas-wrap{
      width:100%;max-width:480px;
      flex:1 1 auto;min-height:0;
      display:flex;align-items:center;justify-content:center;
      padding:0 8px;position:relative;
    }
    #game-canvas{
      display:block;width:100%;aspect-ratio:1/1;max-height:100%;
      background:#000;border-radius:20px;
      border:1px solid #181818;
      box-shadow:0 0 0 1px #111,0 0 50px rgba(0,0,0,.8);
      image-rendering:pixelated;
    }

    /* ── OVERLAY ── */
    #overlay{
      position:absolute;inset:0;border-radius:20px;
      display:flex;flex-direction:column;align-items:center;justify-content:center;
      gap:14px;background:rgba(0,0,0,.85);
      backdrop-filter:blur(3px);transition:opacity .35s;
    }
    #overlay.hidden{opacity:0;pointer-events:none}
    #overlay-title{
      font-family:'Press Start 2P',monospace;
      font-size:clamp(13px,4vw,21px);
      color:var(--accent);text-align:center;line-height:1.65;
      text-shadow:0 0 22px var(--accent);
      transition:color .4s,text-shadow .4s;
    }
    #overlay-sub{
      font-family:'Press Start 2P',monospace;
      font-size:clamp(6px,1.8vw,9px);
      color:var(--mid);text-align:center;line-height:2;
    }
    #overlay-score{
      font-family:'Press Start 2P',monospace;
      font-size:clamp(7px,2.2vw,11px);color:var(--fg);
    }
    .blink{animation:blink 1.1s step-end infinite}
    @keyframes blink{50%{opacity:0}}

    /* ── SCANLINES ── */
    #scanlines{
      position:absolute;inset:0;border-radius:20px;pointer-events:none;
      background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,.07) 2px,rgba(0,0,0,.07) 4px);
    }

    /* ── CONTROLS ── */
    #controls{
      width:100%;max-width:480px;
      display:grid;grid-template-columns:1fr 1fr;
      gap:10px;padding:10px 12px calc(10px + var(--safe-bottom));
      flex-shrink:0;
    }
    .btn{
      height:var(--btn-h);border-radius:22px;
      border:1.5px solid #222;background:#0d0d0d;color:var(--fg);
      cursor:pointer;display:flex;flex-direction:column;
      align-items:center;justify-content:center;gap:5px;
      -webkit-tap-highlight-color:transparent;
      transition:background .08s,border-color .1s,transform .06s,box-shadow .1s;
      position:relative;overflow:hidden;
    }
    .btn::before{
      content:'';position:absolute;inset:0;border-radius:inherit;
      background:linear-gradient(180deg,rgba(255,255,255,.045) 0%,transparent 55%);
      pointer-events:none;
    }
    .btn:active,.btn.pressed{
      background:#181818;border-color:var(--accent);
      transform:scale(0.955);
      box-shadow:0 0 0 1px var(--accent),0 0 18px color-mix(in srgb,var(--accent) 20%,transparent);
    }
    .btn-icon{font-size:27px;line-height:1;transition:transform .1s}
    .btn.pressed .btn-icon{transform:scale(.88)}
    .btn-label{font-family:'Press Start 2P',monospace;font-size:7px;color:var(--mid);letter-spacing:.1em}

    /* ── THEME TRANSITIONS ── */
    .theme-brix{--accent:var(--a2)}
  </style>
</head>
<body>
<div id="app">
  <div id="topbar">
    <button id="menu-btn" class="hidden">MENU</button>
    <div id="game-title">ARCADE</div>
    <div id="topright">
      <div id="lives">
        <div class="life-pip" id="life0"></div>
        <div class="life-pip" id="life1"></div>
        <div class="life-pip" id="life2"></div>
      </div>
      <div id="score-display">SCORE <span id="score-val">0</span></div>
    </div>
  </div>

  <div id="canvas-wrap">
    <canvas id="game-canvas"></canvas>
    <div id="scanlines"></div>
    <div id="overlay">
      <div id="overlay-title">ARCADE</div>
      <div id="overlay-sub"></div>
      <div id="overlay-score" style="display:none"></div>
    </div>
  </div>

  <div id="controls">
    <button class="btn" id="btn-left" aria-label="Left">
      <div class="btn-icon" id="icon-left">◀</div>
      <div class="btn-label" id="label-left">LEFT</div>
    </button>
    <button class="btn" id="btn-right" aria-label="Right">
      <div class="btn-icon" id="icon-right">▶</div>
      <div class="btn-label" id="label-right">RIGHT</div>
    </button>
  </div>
</div>

<script>
(()=>{
"use strict";
// ═══════════════════════════════════════════════════════════
// SHARED SETUP
// ═══════════════════════════════════════════════════════════
const canvas  = document.getElementById("game-canvas");
const ctx     = canvas.getContext("2d");
const P       = 400;
canvas.width  = P;
canvas.height = P;

const appEl     = document.getElementById("app");
const overlay   = document.getElementById("overlay");
const ovTitle   = document.getElementById("overlay-title");
const ovSub     = document.getElementById("overlay-sub");
const ovScore   = document.getElementById("overlay-score");
const titleEl   = document.getElementById("game-title");
const menuBtn   = document.getElementById("menu-btn");
const scoreVal  = document.getElementById("score-val");
const livesEl   = document.getElementById("lives");
const btnLeft   = document.getElementById("btn-left");
const btnRight  = document.getElementById("btn-right");
const iconLeft  = document.getElementById("icon-left");
const iconRight = document.getElementById("icon-right");
const labelLeft = document.getElementById("label-left");
const labelRight= document.getElementById("label-right");

// ── GLOBAL STATE ──
const SCENE = { MENU:0, RUNNER:1, BRIX:2 };
let scene    = SCENE.MENU;
const STATE  = { IDLE:0, PLAY:1, OVER:2 };
let state    = STATE.IDLE;

let leftDown  = false;
let rightDown = false;
let frame     = 0;

// ── OVERLAY HELPERS ──
function showOverlay(title, sub, scoreStr) {
  ovTitle.innerHTML = title;
  ovSub.innerHTML   = sub;
  if (scoreStr) { ovScore.style.display=""; ovScore.textContent = scoreStr; }
  else            { ovScore.style.display="none"; }
  overlay.classList.remove("hidden");
}
function hideOverlay() { overlay.classList.add("hidden"); }

// ── LIVES UI ──
const LIVES_MAX = 3;
function updateLivesUI(n) {
  for (let i=0;i<LIVES_MAX;i++)
    document.getElementById("life"+i).classList.toggle("dead", i>=n);
}
function updateScoreUI(n) { scoreVal.textContent = Math.floor(n); }

// ── THEME ──
function setTheme(t) {
  const isMenu   = t === "menu";
  const isBrix   = t === "brix";
  const isRunner = t === "runner";

  appEl.style.setProperty("--accent", isBrix ? "var(--a2)" : "var(--a1)");
  ovTitle.style.color = isBrix ? "var(--a2)" : "var(--a1)";
  ovTitle.style.textShadow = isBrix
    ? "0 0 22px var(--a2)" : "0 0 22px var(--a1)";

  if (isMenu) {
    titleEl.textContent = "ARCADE";
    iconLeft.textContent  = "◀";
    iconRight.textContent = "▶";
    labelLeft.textContent  = "SELECT";
    labelRight.textContent = "SELECT";
    menuBtn.classList.add("hidden");
    updateLivesUI(0);
    updateScoreUI(0);
  } else if (isRunner) {
    titleEl.textContent = "VOID RUNNER";
    iconLeft.textContent  = "▲";
    iconRight.textContent = "▼";
    labelLeft.textContent  = "JUMP";
    labelRight.textContent = "DUCK";
    menuBtn.classList.remove("hidden");
  } else {
    titleEl.textContent = "BRIX";
    iconLeft.textContent  = "◀";
    iconRight.textContent = "▶";
    labelLeft.textContent  = "LEFT";
    labelRight.textContent = "RIGHT";
    menuBtn.classList.remove("hidden");
  }
}

// ═══════════════════════════════════════════════════════════
// MENU
// ═══════════════════════════════════════════════════════════
const menuStars = Array.from({length:60},()=>({
  x:Math.random()*P, y:Math.random()*P,
  r:Math.random()*1.3+.2,
  speed:Math.random()*.3+.05,
  alpha:Math.random()*.6+.2,
}));

function drawMenu() {
  ctx.clearRect(0,0,P,P);
  // bg
  ctx.fillStyle="#000";
  ctx.fillRect(0,0,P,P);

  // stars
  for(const s of menuStars){
    ctx.globalAlpha=s.alpha*(0.5+0.5*Math.sin(frame*.03+s.x*.05));
    ctx.fillStyle="#fff";
    ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fill();
    s.x -= s.speed;
    if(s.x<0){s.x=P;s.y=Math.random()*P;}
  }
  ctx.globalAlpha=1;

  // divider
  ctx.strokeStyle="#1a1a1a";ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(P/2,20);ctx.lineTo(P/2,P-20);ctx.stroke();

  // ── LEFT: VOID RUNNER ──
  drawMenuCard(0, 0, P/2, P, "#e8ff57", "VOID\nRUNNER", drawRunnerPreview, "JUMP\nDUCK");

  // ── RIGHT: BRIX ──
  drawMenuCard(P/2, 0, P/2, P, "#57e8ff", "BRIX", drawBrixPreview, "LEFT\nRIGHT");
}

function drawMenuCard(x,y,w,h,col,title,previewFn,hint) {
  ctx.save();
  ctx.translate(x,y);

  // subtle bg glow
  const g=ctx.createRadialGradient(w/2,h/2,10,w/2,h/2,h*.6);
  g.addColorStop(0,col+"0a");g.addColorStop(1,"transparent");
  ctx.fillStyle=g;ctx.fillRect(0,0,w,h);

  // preview area
  const previewH = h * 0.42;
  const previewY = h * 0.22;
  ctx.save();
  ctx.beginPath();
  ctx.rect(8,previewY,w-16,previewH);
  ctx.clip();
  previewFn(8,previewY,w-16,previewH,col);
  ctx.restore();

  // title
  ctx.font="bold 10px 'Press Start 2P',monospace";
  ctx.fillStyle=col;
  ctx.textAlign="center";
  ctx.shadowColor=col;ctx.shadowBlur=14;
  const lines=title.split("\n");
  lines.forEach((l,i)=>{
    ctx.fillText(l,w/2, h*0.16 + i*16);
  });
  ctx.shadowBlur=0;

  // hint
  ctx.font="6px 'Press Start 2P',monospace";
  ctx.fillStyle="#444";
  ctx.shadowBlur=0;
  const hintLines=hint.split("\n");
  hintLines.forEach((l,i)=>{
    ctx.fillText(l,w/2, h*0.76 + i*12);
  });

  // pulse arrow
  const pulse=0.5+0.5*Math.sin(frame*.08);
  ctx.font="13px monospace";
  ctx.fillStyle=col;
  ctx.globalAlpha=pulse;
  ctx.fillText("▼",w/2, h*0.9);
  ctx.globalAlpha=1;

  ctx.restore();
}

function drawRunnerPreview(x,y,w,h,col) {
  // mini ground
  const gy = y+h*0.78;
  ctx.strokeStyle="#333";ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(x,gy);ctx.lineTo(x+w,gy);ctx.stroke();

  // animated mini-runner
  const run = frame*0.18;
  const rx = x+w*0.25;
  const legAnim = Math.sin(run)*4;
  ctx.fillStyle="#fff";
  // torso
  ctx.fillRect(rx-5,gy-22,10,14);
  // legs
  ctx.fillRect(rx-4,gy-8,4,8+legAnim);
  ctx.fillRect(rx,  gy-8,4,8-legAnim);
  // head
  ctx.fillStyle=col;
  ctx.fillRect(rx-4,gy-28,8,8);

  // mini obstacle
  const ox = x+w*0.65;
  ctx.fillStyle="#ff4f4f";
  ctx.fillRect(ox,gy-14,10,14);
  ctx.fillStyle="#ff4f4f";
  ctx.globalAlpha=0.3;
  ctx.fillRect(ox,gy-14,10,14);
  ctx.globalAlpha=1;
}

function drawBrixPreview(x,y,w,h,col) {
  // mini bricks
  const bw=14,bh=6,gap=3;
  const cols=Math.floor((w-6)/(bw+gap));
  const brixColors=["#ff4f4f","#ff8c4f","#ffee4f",col,"#4fb8ff"];
  for(let r=0;r<5;r++){
    for(let c=0;c<cols;c++){
      ctx.fillStyle=brixColors[r%brixColors.length];
      ctx.globalAlpha=0.9;
      ctx.fillRect(x+3+c*(bw+gap), y+4+r*(bh+gap), bw, bh);
    }
  }
  ctx.globalAlpha=1;

  // ball
  const bx = x+w*0.5 + Math.sin(frame*.06)*w*0.3;
  const by = y+h*0.55 + Math.sin(frame*.09+1)*h*0.2;
  ctx.fillStyle="#fff";
  ctx.shadowColor=col;ctx.shadowBlur=6;
  ctx.beginPath();ctx.arc(bx,by,4,0,Math.PI*2);ctx.fill();
  ctx.shadowBlur=0;

  // paddle
  const py=y+h*0.9;
  ctx.fillStyle="#fff";
  ctx.fillRect(x+w/2-18,py,36,5);
}

function updateMenu() {
  frame++;
}

// ═══════════════════════════════════════════════════════════
// VOID RUNNER
// ═══════════════════════════════════════════════════════════
const GROUND_Y   = P*0.78;
const PLAYER_X   = P*0.18;
const PLAYER_W   = 22;
const PLAYER_TALL= 34;
const PLAYER_H_DUCK=20;
const JUMP_FORCE = -13.5;
const GRAVITY    = 0.62;
const TILE       = 8;

const rStars = Array.from({length:40},()=>({
  x:Math.random()*P, y:Math.random()*GROUND_Y*.9,
  r:Math.random()*1.2+.3, speed:Math.random()*.4+.1, alpha:Math.random()*.6+.2,
}));

let rPlayer, rObstacles, rParticles;
let rSpeed, rFrame, rScore, rHighScore=0, rLives;
let rSpawnTimer, rNextSpawn, rDiffFrame, rCombo, rComboFlash;

const RC = {
  bg:"#000",fg:"#fff",accent:"#e8ff57",
  dim:"#333",mid:"#666",danger:"#ff4f4f",
};

function runnerInit() {
  rPlayer = {
    y:GROUND_Y-PLAYER_TALL, vy:0,
    jumping:false, ducking:false, flashTimer:0,
    get h(){return this.ducking?PLAYER_H_DUCK:PLAYER_TALL},
    get bottom(){return this.y+this.h},
  };
  rObstacles=[];rParticles=[];
  rSpeed=3.2;rFrame=0;rScore=0;rLives=3;
  rSpawnTimer=0;rNextSpawn=85;rDiffFrame=0;rCombo=0;rComboFlash=0;
  updateLivesUI(rLives);
  updateScoreUI(0);
}

function runnerSpawnObs() {
  const type=Math.random()<.5?"A":"B";
  const w=TILE*(Math.floor(Math.random()*3)+2);
  if(type==="A"){
    const h=TILE*(Math.floor(Math.random()*2)+2);
    rObstacles.push({type,x:P+10,y:GROUND_Y-h,w,h,passed:false});
  } else {
    const h=TILE*2;
    rObstacles.push({type,x:P+10,y:GROUND_Y-PLAYER_TALL*.55-h-2,w,h,passed:false});
  }
}

function rSpawnParticles(x,y,col,n=8){
  for(let i=0;i<n;i++) rParticles.push({
    x,y,vx:(Math.random()-.5)*5,vy:(Math.random()-.5)*5-2,
    life:1,col,r:Math.random()*3+1,
  });
}

function rRectsOverlap(ax,ay,aw,ah,bx,by,bw,bh){
  const m=5;
  return ax+m<bx+bw-m && ax+aw-m>bx+m &&
         ay+m<by+bh-m && ay+ah-m>by+bh*.05;
}

function runnerStart() {
  runnerInit();
  state=STATE.PLAY;
  hideOverlay();
}

function runnerOver() {
  state=STATE.OVER;
  if(rScore>rHighScore) rHighScore=rScore;
  setTimeout(()=>{
    showOverlay("GAME<br>OVER",
      '<span class="blink">PRESS ANY BUTTON</span>',
      `SCORE ${Math.floor(rScore)}  HI ${Math.floor(rHighScore)}`);
  },600);
}

function runnerUpdate() {
  rFrame++;rDiffFrame++;
  if(rDiffFrame%280===0) rSpeed=Math.min(rSpeed+.25,7.5);
  rScore+=rSpeed*.04;
  updateScoreUI(rScore);

  for(const s of rStars){
    s.x-=s.speed;
    if(s.x<0){s.x=P;s.y=Math.random()*GROUND_Y*.9;}
  }

  if(!rPlayer.ducking||rPlayer.jumping) rPlayer.vy+=GRAVITY;
  rPlayer.y+=rPlayer.vy;

  const gf=GROUND_Y-rPlayer.h;
  if(rPlayer.y>=gf){rPlayer.y=gf;rPlayer.vy=0;rPlayer.jumping=false;}
  if(rPlayer.ducking&&!rPlayer.jumping) rPlayer.y=GROUND_Y-PLAYER_H_DUCK;
  rPlayer.flashTimer=Math.max(0,rPlayer.flashTimer-1);

  // jump input
  if(leftDown && !rPlayer.jumping && rPlayer.bottom>=GROUND_Y-2){
    rPlayer.vy=JUMP_FORCE;
    rPlayer.jumping=true;
    rSpawnParticles(PLAYER_X+PLAYER_W/2,rPlayer.bottom,RC.accent,5);
  }
  rPlayer.ducking = rightDown;

  rSpawnTimer++;
  if(rSpawnTimer>=rNextSpawn){
    rSpawnTimer=0;
    rNextSpawn=Math.max(50,100-Math.floor(rSpeed*5))+Math.floor(Math.random()*30);
    runnerSpawnObs();
  }

  for(let i=rObstacles.length-1;i>=0;i--){
    const ob=rObstacles[i];
    ob.x-=rSpeed;
    if(!ob.passed&&ob.x+ob.w<PLAYER_X){
      ob.passed=true;rCombo++;rComboFlash=30;
      rSpawnParticles(PLAYER_X,rPlayer.y+rPlayer.h/2,RC.accent,4);
    }
    if(ob.x+ob.w<-10){rObstacles.splice(i,1);continue;}
    if(rPlayer.flashTimer===0){
      if(rRectsOverlap(PLAYER_X,rPlayer.y,PLAYER_W,rPlayer.h,ob.x,ob.y,ob.w,ob.h)){
        rPlayer.flashTimer=60;rCombo=0;
        rSpawnParticles(PLAYER_X+PLAYER_W/2,rPlayer.y+rPlayer.h/2,RC.danger,12);
        rLives--;updateLivesUI(rLives);
        if(rLives<=0){runnerOver();return;}
      }
    }
  }
  for(let i=rParticles.length-1;i>=0;i--){
    const p=rParticles[i];
    p.x+=p.vx;p.y+=p.vy;p.vy+=.15;p.life-=.04;
    if(p.life<=0) rParticles.splice(i,1);
  }
  rComboFlash=Math.max(0,rComboFlash-1);
}

function runnerDraw() {
  ctx.clearRect(0,0,P,P);
  ctx.fillStyle=RC.bg;ctx.fillRect(0,0,P,P);

  // stars
  for(const s of rStars){
    ctx.globalAlpha=s.alpha*(0.5+0.5*Math.sin(rFrame*.04+s.x));
    ctx.fillStyle="#fff";ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fill();
  }
  ctx.globalAlpha=1;

  // ground
  ctx.strokeStyle="#1c1c1c";ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(0,GROUND_Y);ctx.lineTo(P,GROUND_Y);ctx.stroke();
  ctx.strokeStyle="#555";ctx.lineWidth=1;
  ctx.setLineDash([12,24]);ctx.lineDashOffset=-(rFrame*rSpeed*.5)%36;
  ctx.beginPath();ctx.moveTo(0,GROUND_Y+6);ctx.lineTo(P,GROUND_Y+6);ctx.stroke();
  ctx.setLineDash([]);
  const grad=ctx.createLinearGradient(0,GROUND_Y,0,P);
  grad.addColorStop(0,"#0a0a0a");grad.addColorStop(1,"#000");
  ctx.fillStyle=grad;ctx.fillRect(0,GROUND_Y,P,P-GROUND_Y);

  // obstacles
  for(const ob of rObstacles){
    ctx.save();
    ctx.shadowColor=ob.type==="A"?RC.danger:"#4fb8ff";ctx.shadowBlur=8;
    ctx.fillStyle=ob.type==="A"?RC.danger:"#4fb8ff";
    const cols=Math.round(ob.w/TILE),rows=Math.round(ob.h/TILE);
    for(let r=0;r<rows;r++) for(let c=0;c<cols;c++){
      ctx.globalAlpha=(r+c)%2===0?1:.7;
      ctx.fillRect(ob.x+c*TILE,ob.y+r*TILE,TILE-1,TILE-1);
    }
    ctx.globalAlpha=1;ctx.restore();
  }

  // player
  if(state===STATE.PLAY){
    const x=PLAYER_X,ph=rPlayer.h;
    const py=rPlayer.ducking?GROUND_Y-PLAYER_H_DUCK:rPlayer.y;
    if(!(rPlayer.flashTimer>0&&Math.floor(rPlayer.flashTimer/3)%2===0)){
      ctx.save();ctx.shadowColor=RC.accent;ctx.shadowBlur=12;
      ctx.fillStyle=RC.fg;
      if(rPlayer.ducking){
        ctx.fillRect(x,py,PLAYER_W,PLAYER_H_DUCK);
        ctx.fillStyle=RC.accent;ctx.fillRect(x+PLAYER_W*.55,py+3,PLAYER_W*.3,5);
      } else {
        const la=Math.sin(rFrame*.28)*3;
        ctx.fillRect(x+4,py+ph-10,6,10+la);
        ctx.fillRect(x+PLAYER_W-10,py+ph-10,6,10-la);
        ctx.fillRect(x,py,PLAYER_W,ph-10);
        ctx.fillStyle=RC.accent;ctx.fillRect(x+3,py,PLAYER_W-6,12);
        ctx.fillStyle=RC.bg;ctx.fillRect(x+6,py+3,PLAYER_W-12,6);
      }
      ctx.restore();
    }
  }

  // particles
  for(const p of rParticles){
    ctx.globalAlpha=p.life;ctx.fillStyle=p.col;
    ctx.beginPath();ctx.arc(p.x,p.y,p.r*p.life,0,Math.PI*2);ctx.fill();
  }
  ctx.globalAlpha=1;

  // HUD
  if(state===STATE.PLAY){
    const sp=Math.min((rSpeed-3.2)/4,1);
    ctx.fillStyle="#222";ctx.fillRect(P-72,14,60,3);
    ctx.fillStyle=RC.accent;ctx.fillRect(P-72,14,60*sp,3);
    if(rCombo>1&&rComboFlash>0){
      ctx.globalAlpha=Math.min(rComboFlash/20,1);
      ctx.font="9px 'Press Start 2P',monospace";
      ctx.fillStyle=RC.accent;ctx.textAlign="left";
      ctx.fillText("×"+rCombo,PLAYER_X+PLAYER_W+8,rPlayer.y-5);
      ctx.globalAlpha=1;
    }
  }
}

// ═══════════════════════════════════════════════════════════
// BRIX (Breakout)
// ═══════════════════════════════════════════════════════════
const BC = {
  bg:"#000",fg:"#fff",accent:"#57e8ff",
  dim:"#222",mid:"#555",
  brick:["#ff4f4f","#ff8a4f","#ffe04f","#57e8ff","#a057ff"],
};

const B_MARGIN   = 15;
const B_COLS     = 8;
const B_GAP      = 4;
const B_BW       = Math.floor((P - B_MARGIN*2 - B_GAP*(B_COLS-1)) / B_COLS); // 42
const B_BH       = 13;
const B_TOP      = 52;
const B_ROW_GAP  = 5;

const PADDLE_H   = 9;
const PADDLE_Y   = P - 24;
const BALL_R     = 6;
const PADDLE_SPD = 5.5;

let bBricks, bBall, bPaddle, bScore, bHighScore=0, bLives, bLevel;
let bParticles, bFrame;
let bLaunch;

function brixInit() {
  bLevel  = 1;
  bScore  = 0;
  bLives  = 3;
  bFrame  = 0;
  bParticles = [];
  bBuildLevel();
  updateLivesUI(bLives);
  updateScoreUI(0);
}

function bBuildLevel() {
  bBricks = [];
  const rows = Math.min(4 + bLevel, 8);
  for(let r=0;r<rows;r++){
    for(let c=0;c<B_COLS;c++){
      bBricks.push({
        x: B_MARGIN + c*(B_BW+B_GAP),
        y: B_TOP + r*(B_BH+B_ROW_GAP),
        w: B_BW, h: B_BH,
        col: BC.brick[r % BC.brick.length],
        alive: true,
      });
    }
  }
  bResetBall();
}

function bResetBall() {
  bPaddle = { x: P/2-40, w: Math.max(50, 80-bLevel*5), y: PADDLE_Y };
  const angle = -Math.PI/2 + (Math.random()-.5)*.8;
  const spd   = 3.5 + bLevel*.4;
  bBall = {
    x: P/2, y: PADDLE_Y-BALL_R-2,
    vx: Math.cos(angle)*spd,
    vy: Math.sin(angle)*spd,
    r: BALL_R,
  };
  bLaunch = false; // wait for button press to launch
}

function bSpawnParticles(x,y,col,n=10){
  for(let i=0;i<n;i++) bParticles.push({
    x,y,vx:(Math.random()-.5)*6,vy:(Math.random()-.5)*6-1.5,
    life:1,col,r:Math.random()*3+1,
  });
}

function brixStart() {
  brixInit();
  state=STATE.PLAY;
  bLaunch=false;
  hideOverlay();
}

function brixOver() {
  state=STATE.OVER;
  if(bScore>bHighScore) bHighScore=bScore;
  setTimeout(()=>{
    showOverlay("GAME<br>OVER",
      '<span class="blink">PRESS ANY BUTTON</span>',
      `SCORE ${Math.floor(bScore)}  HI ${Math.floor(bHighScore)}`);
  },600);
}

function brixUpdate() {
  bFrame++;

  // paddle movement
  const ph_half = bPaddle.w/2;
  if(leftDown)  bPaddle.x = Math.max(0, bPaddle.x - PADDLE_SPD);
  if(rightDown) bPaddle.x = Math.min(P - bPaddle.w, bPaddle.x + PADDLE_SPD);

  // launch on any press
  if(!bLaunch && (leftDown||rightDown)) {
    bLaunch=true;
    const angle=-Math.PI/2+(Math.random()-.5)*.6;
    const spd=3.5+bLevel*.4;
    bBall.vx=Math.cos(angle)*spd;
    bBall.vy=Math.sin(angle)*spd;
  }

  if(!bLaunch) {
    bBall.x = bPaddle.x + bPaddle.w/2;
    bBall.y = PADDLE_Y - BALL_R - 1;
  } else {
    bBall.x += bBall.vx;
    bBall.y += bBall.vy;
  }

  // wall bounces
  if(bBall.x-bBall.r<0){bBall.x=bBall.r;bBall.vx=Math.abs(bBall.vx);}
  if(bBall.x+bBall.r>P){bBall.x=P-bBall.r;bBall.vx=-Math.abs(bBall.vx);}
  if(bBall.y-bBall.r<0){bBall.y=bBall.r;bBall.vy=Math.abs(bBall.vy);}

  // paddle collision
  const px=bPaddle.x, py=PADDLE_Y, pw=bPaddle.w;
  if(bBall.vy>0 &&
     bBall.y+bBall.r>=py && bBall.y+bBall.r<=py+PADDLE_H+4 &&
     bBall.x>=px-2 && bBall.x<=px+pw+2){
    bBall.y=py-bBall.r-1;
    bBall.vy=-Math.abs(bBall.vy);
    // angle based on hit position
    const hit=(bBall.x-(px+pw/2))/(pw/2);
    bBall.vx = hit * (3.5+bLevel*.3);
    const spd=Math.hypot(bBall.vx,bBall.vy);
    const tspd=3.5+bLevel*.4;
    if(spd>0){bBall.vx=bBall.vx/spd*tspd;bBall.vy=bBall.vy/spd*tspd;}
    bSpawnParticles(bBall.x,py,BC.accent,5);
  }

  // fell off bottom
  if(bBall.y-bBall.r>P+10){
    bLives--;updateLivesUI(bLives);
    bSpawnParticles(bBall.x,P-20,BC.accent,12);
    if(bLives<=0){brixOver();return;}
    bResetBall();
  }

  // brick collision
  for(const br of bBricks){
    if(!br.alive) continue;
    const bl=br.x,bt=br.y,brr=br.x+br.w,bb=br.y+br.h;
    const nx=Math.max(bl,Math.min(bBall.x,brr));
    const ny=Math.max(bt,Math.min(bBall.y,bb));
    const dx=bBall.x-nx,dy=bBall.y-ny;
    if(dx*dx+dy*dy<bBall.r*bBall.r){
      br.alive=false;
      bScore+=10*bLevel;
      updateScoreUI(bScore);
      bSpawnParticles(br.x+br.w/2,br.y+br.h/2,br.col,8);
      // reflect
      const overlapX=Math.min(bBall.x-bl,brr-bBall.x);
      const overlapY=Math.min(bBall.y-bt,bb-bBall.y);
      if(overlapX<overlapY) bBall.vx=-bBall.vx;
      else bBall.vy=-bBall.vy;
    }
  }

  // all cleared?
  if(bBricks.every(b=>!b.alive)){
    bLevel++;
    bBuildLevel();
    showOverlay(`LEVEL ${bLevel}`,'<span class="blink">PRESS TO CONTINUE</span>');
    state=STATE.IDLE;
    return;
  }

  // particles
  for(let i=bParticles.length-1;i>=0;i--){
    const p=bParticles[i];
    p.x+=p.vx;p.y+=p.vy;p.vy+=.18;p.life-=.035;
    if(p.life<=0) bParticles.splice(i,1);
  }
}

function brixDraw() {
  ctx.clearRect(0,0,P,P);
  ctx.fillStyle=BC.bg;ctx.fillRect(0,0,P,P);

  // grid bg glow
  const bg=ctx.createRadialGradient(P/2,P*.3,20,P/2,P*.3,P*.6);
  bg.addColorStop(0,"#57e8ff08");bg.addColorStop(1,"transparent");
  ctx.fillStyle=bg;ctx.fillRect(0,0,P,P);

  // bricks
  for(const br of bBricks){
    if(!br.alive) continue;
    ctx.save();
    ctx.shadowColor=br.col;ctx.shadowBlur=6;
    ctx.fillStyle=br.col;ctx.globalAlpha=.95;
    ctx.fillRect(br.x+1,br.y+1,br.w-2,br.h-2);
    // shine
    ctx.fillStyle="rgba(255,255,255,.18)";
    ctx.fillRect(br.x+2,br.y+2,br.w-4,3);
    ctx.globalAlpha=1;ctx.restore();
  }

  // paddle
  ctx.save();
  ctx.shadowColor=BC.accent;ctx.shadowBlur=14;
  const padGrad=ctx.createLinearGradient(bPaddle.x,0,bPaddle.x+bPaddle.w,0);
  padGrad.addColorStop(0,"#fff");padGrad.addColorStop(.5,BC.accent);padGrad.addColorStop(1,"#fff");
  ctx.fillStyle=padGrad;
  const pr=PADDLE_H/2;
  ctx.beginPath();
  ctx.roundRect(bPaddle.x,PADDLE_Y,bPaddle.w,PADDLE_H,pr);
  ctx.fill();
  ctx.restore();

  // ball
  ctx.save();
  ctx.shadowColor=BC.accent;ctx.shadowBlur=16;
  const ballGrad=ctx.createRadialGradient(bBall.x-1,bBall.y-1,1,bBall.x,bBall.y,bBall.r);
  ballGrad.addColorStop(0,"#fff");ballGrad.addColorStop(1,BC.accent);
  ctx.fillStyle=ballGrad;
  ctx.beginPath();ctx.arc(bBall.x,bBall.y,bBall.r,0,Math.PI*2);ctx.fill();
  ctx.restore();

  // trail dots
  if(bLaunch){
    for(let i=1;i<=4;i++){
      const tx=bBall.x-bBall.vx*i*.7;
      const ty=bBall.y-bBall.vy*i*.7;
      ctx.globalAlpha=(1-i/5)*.5;
      ctx.fillStyle=BC.accent;
      ctx.beginPath();ctx.arc(tx,ty,bBall.r*.5,0,Math.PI*2);ctx.fill();
    }
    ctx.globalAlpha=1;
  } else {
    // aim guide dots
    ctx.globalAlpha=.25;
    ctx.fillStyle=BC.accent;
    for(let i=1;i<=6;i++){
      const angle=-Math.PI/2;
      ctx.beginPath();
      ctx.arc(bBall.x,bBall.y-i*14,2,0,Math.PI*2);
      ctx.fill();
    }
    ctx.globalAlpha=1;
  }

  // particles
  for(const p of bParticles){
    ctx.globalAlpha=p.life;ctx.fillStyle=p.col;
    ctx.beginPath();ctx.arc(p.x,p.y,p.r*p.life,0,Math.PI*2);ctx.fill();
  }
  ctx.globalAlpha=1;

  // HUD: level
  if(state===STATE.PLAY){
    ctx.font="7px 'Press Start 2P',monospace";
    ctx.fillStyle="#333";ctx.textAlign="right";
    ctx.fillText("LVL "+bLevel, P-14, P-8);
    ctx.textAlign="left";
  }
}

// ═══════════════════════════════════════════════════════════
// INPUT
// ═══════════════════════════════════════════════════════════
function onLeftDown(e){
  e.preventDefault();
  btnLeft.classList.add("pressed");
  leftDown=true;
  handleAnyPress("left");
}
function onLeftUp(e){
  e.preventDefault();
  btnLeft.classList.remove("pressed");
  leftDown=false;
}
function onRightDown(e){
  e.preventDefault();
  btnRight.classList.add("pressed");
  rightDown=true;
  handleAnyPress("right");
}
function onRightUp(e){
  e.preventDefault();
  btnRight.classList.remove("pressed");
  rightDown=false;
}

function handleAnyPress(side) {
  if(scene===SCENE.MENU){
    if(side==="left")  goToGame("runner");
    if(side==="right") goToGame("brix");
    return;
  }
  if(state===STATE.IDLE||state===STATE.OVER){
    if(scene===SCENE.RUNNER) runnerStart();
    else if(scene===SCENE.BRIX){
      if(state===STATE.IDLE){
        // resume from level-up
        bLaunch=false;hideOverlay();state=STATE.PLAY;
      } else brixStart();
    }
    return;
  }
  // runner: left=jump handled in update
}

function goToGame(which) {
  if(which==="runner"){
    scene=SCENE.RUNNER;
    setTheme("runner");
    state=STATE.IDLE;
    runnerInit();
    showOverlay("VOID<br>RUNNER","JUMP to leap over blocks<br>DUCK to slide under beams");
  } else {
    scene=SCENE.BRIX;
    setTheme("brix");
    state=STATE.IDLE;
    brixInit();
    showOverlay("BRIX","LEFT & RIGHT to move paddle<br>PRESS TO LAUNCH");
  }
}

menuBtn.addEventListener("click",()=>{
  scene=SCENE.MENU;state=STATE.IDLE;
  setTheme("menu");leftDown=false;rightDown=false;
  hideOverlay();
});
menuBtn.addEventListener("touchend",e=>{e.preventDefault();menuBtn.click();},{passive:false});

btnLeft.addEventListener("touchstart",onLeftDown,{passive:false});
btnLeft.addEventListener("touchend",  onLeftUp,  {passive:false});
btnLeft.addEventListener("mousedown",onLeftDown);
btnLeft.addEventListener("mouseup",  onLeftUp);
btnRight.addEventListener("touchstart",onRightDown,{passive:false});
btnRight.addEventListener("touchend",  onRightUp,  {passive:false});
btnRight.addEventListener("mousedown",onRightDown);
btnRight.addEventListener("mouseup",  onRightUp);

document.addEventListener("keydown",e=>{
  if(e.key==="ArrowLeft"||e.key==="a")  onLeftDown(e);
  if(e.key==="ArrowRight"||e.key==="d") onRightDown(e);
  if(scene===SCENE.RUNNER){
    if(e.key==="ArrowUp"||e.key==="w"||e.key===" ") onLeftDown(e);
    if(e.key==="ArrowDown"||e.key==="s") onRightDown(e);
  }
});
document.addEventListener("keyup",e=>{
  if(e.key==="ArrowLeft"||e.key==="a")  onLeftUp(e);
  if(e.key==="ArrowRight"||e.key==="d") onRightUp(e);
  if(scene===SCENE.RUNNER){
    if(e.key==="ArrowUp"||e.key==="w"||e.key===" ") onLeftUp(e);
    if(e.key==="ArrowDown"||e.key==="s") onRightUp(e);
  }
});

// ═══════════════════════════════════════════════════════════
// MAIN LOOP
// ═══════════════════════════════════════════════════════════
function loop() {
  if(scene===SCENE.MENU){
    updateMenu();
    drawMenu();
  } else if(scene===SCENE.RUNNER){
    if(state===STATE.PLAY) runnerUpdate();
    runnerDraw();
  } else if(scene===SCENE.BRIX){
    if(state===STATE.PLAY) brixUpdate();
    brixDraw();
  }
  requestAnimationFrame(loop);
}

// ── INIT ──
setTheme("menu");
loop();

})();
</script>
